name: Release

# Manual only. Releases are normally published from a local machine with `vsce publish` plus
# `gh release create`. This workflow is the fallback for publishing from CI; it needs the
# VSCE_PAT repository secret (a Visual Studio Marketplace personal access token).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx @vscode/vsce package --no-dependencies
      - name: Publish to VS Marketplace
        run: npx @vscode/vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Create GitHub release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" ./*.vsix --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
