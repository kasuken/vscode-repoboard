name: Release

# Publishes to the VS Marketplace and creates a GitHub Release when a version tag (v*) is pushed.
# Requires the VSCE_PAT repository secret (a Visual Studio Marketplace personal access token).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx @vscode/vsce package --no-dependencies
      - name: Publish to VS Marketplace
        run: npx @vscode/vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
