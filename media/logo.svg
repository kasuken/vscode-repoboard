<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2f4a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#sheen)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="116.5" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="3"/>

  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- 3x3 board: each tile is a repo, coloured by its git state -->
  <g>
    <rect x="86"  y="86"  width="96" height="96" rx="24" fill="#3fb950"/>
    <rect x="208" y="86"  width="96" height="96" rx="24" fill="#2b3c56"/>
    <rect x="330" y="86"  width="96" height="96" rx="24" fill="#58a6ff"/>

    <rect x="86"  y="208" width="96" height="96" rx="24" fill="#2b3c56"/>
    <rect x="330" y="208" width="96" height="96" rx="24" fill="#e3b341"/>

    <rect x="86"  y="330" width="96" height="96" rx="24" fill="#e3b341"/>
    <rect x="208" y="330" width="96" height="96" rx="24" fill="#3fb950"/>
    <rect x="330" y="330" width="96" height="96" rx="24" fill="#2b3c56"/>
  </g>

  <!-- The selected repo: lifted, with a branch glyph -->
  <g filter="url(#shadow)">
    <rect x="196" y="196" width="120" height="120" rx="30" fill="#f4f8fc"/>
  </g>
  <g fill="none" stroke="#12203a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 228 V284"/>
    <path d="M280 240 C280 262 236 258 236 284"/>
  </g>
  <g fill="#f4f8fc" stroke="#12203a" stroke-width="10">
    <circle cx="236" cy="226" r="11"/>
    <circle cx="280" cy="236" r="11"/>
    <circle cx="236" cy="288" r="11"/>
  </g>
</svg>
